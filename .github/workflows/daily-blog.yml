name: Daily blog post (opens a pull request for review)

# Every day at 06:20 IST, Claude picks a current legal topic people in Uttarakhand are
# searching for, writes one short post (English and Hindi) following the skill in
# .claude/skills/daily-law-blog/SKILL.md, checks it with the site validator, and opens a
# pull request. Nothing is published until Aastha merges it; merging deploys via Cloudflare.
#
# Needs repository secret ANTHROPIC_API_KEY, and Settings -> Actions -> General ->
# "Allow GitHub Actions to create and approve pull requests".
# Repository variable BLOG_PAUSED = "true" skips the daily run.

on:
  schedule:
    - cron: "50 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  blog:
    if: ${{ vars.BLOG_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Search Console queries (optional)
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/gsc-report.mjs 28

      - name: Skip if today's run already happened
        id: done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DAY=$(TZ=Asia/Kolkata date +%F)
          N=$(gh api "repos/${{ github.repository }}/pulls?state=all&head=${{ github.repository_owner }}:blog/$DAY" --jq length)
          if [ "${N:-0}" -gt 0 ] && [ "${{ github.event_name }}" = "schedule" ]; then echo "Already done for $DAY; skipping."; echo "skip=yes" >> "$GITHUB_OUTPUT"; else echo "skip=no" >> "$GITHUB_OUTPUT"; fi

      - name: Claude writes today's post
        id: claude
        if: steps.done.outputs.skip != 'yes'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 60
            --allowedTools "Skill,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(node:*),Bash(date:*),Bash(ls:*),Bash(cat:*),Bash(gh pr list:*)"
          prompt: |
            Use the daily-law-blog skill (.claude/skills/daily-law-blog/SKILL.md) and follow it exactly.
            Write today's post for ${{ github.repository }}. Today is the date shown by `date +%F` (use IST: TZ=Asia/Kolkata).

      - name: Check and open the pull request
        if: always() && steps.done.outputs.skip != 'yes' && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE: ${{ steps.claude.outcome }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          NEW=$(git status --porcelain content/blog | awk '{print $2}' | grep '\.json$' || true)
          if [ -z "$NEW" ]; then echo "No post written today."; exit 0; fi
          CHECK=ok
          [ "$CLAUDE" = success ] || { CHECK=failed; echo "ERROR The writing run stopped before finishing (see the agent-failure issue): check every section, the Hindi summary and the sources." > stopped.txt; }
          { node build.mjs && node scripts/validate.mjs; } > check.txt 2>&1 || CHECK=failed
          [ -f stopped.txt ] && cat stopped.txt >> check.txt
          cat check.txt
          DAY=$(TZ=Asia/Kolkata date +%F)
          TITLE=$(node -e "console.log(require('./$(echo "$NEW" | head -1)').title)" 2>/dev/null || echo "Unfinished draft")
          BRANCH="blog/$DAY"
          git config user.name "blog-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add content/blog
          git commit -m "Blog: $TITLE"
          git push origin "$BRANCH"
          [ -f .blog-pr.md ] || echo "Merge to publish. Close without merging to drop it." > .blog-pr.md
          node -e "try{const a=[].concat(JSON.parse(require('fs').readFileSync(process.env.EXEC,'utf8')));const r=a.reverse().find(x=>x&&x.type==='result')||{};console.log('\nClaude cost for this post: \$'+Number(r.total_cost_usd||0).toFixed(2)+' ('+r.num_turns+' turns)')}catch(e){}" >> .blog-pr.md
          gh label create blog --color 0F766E --force || true
          if [ "$CHECK" = failed ]; then
            { echo "> **The site check failed on this post, so it is a draft.** Fix the errors below (or ask Claude to), then mark it ready."; echo; echo '```'; grep -E "ERROR|Error|error|✗" check.txt | head -40; echo '```'; echo; cat .blog-pr.md; } > pr.md
            gh pr create --draft --base main --head "$BRANCH" --label blog --title "Blog $DAY (needs fixes): $TITLE" --body-file pr.md
            exit 1
          fi
          gh pr create --base main --head "$BRANCH" --label blog --title "Blog $DAY: $TITLE" --body-file .blog-pr.md

      - name: Report a failed Claude run
        if: steps.claude.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          MSG=$(node -e "try{const a=JSON.parse(require('fs').readFileSync(process.env.EXEC,'utf8'));const r=[].concat(a).reverse().find(x=>x&&x.type==='result')||{};console.log(String(r.result||r.subtype||'unknown').slice(0,500)+' (turns: '+(r.num_turns??'?')+', cost \$'+Number(r.total_cost_usd||0).toFixed(2)+')')}catch(e){console.log('no execution log: '+e.message)}")
          echo "::error::Claude run failed: $MSG"
          gh label create agent-failure --color B91C1C --force >/dev/null || true
          N=$(gh issue list --label agent-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf '**%s** failed on %s: %s\n\nRun: %s\n\nIf this says *usage limits*, raise the spend limit at console.anthropic.com → Settings → Limits. If it says *credit balance is too low*, add credits at console.anthropic.com → Settings → Billing.\n' "${{ github.workflow }}" "$(TZ=Asia/Kolkata date '+%F %H:%M IST')" "$MSG" "$RUN_URL" > fail.md
          if [ -z "$N" ]; then gh issue create --label agent-failure --title "Scheduled Claude agents: failed runs" --body-file fail.md; else gh issue comment "$N" --body-file fail.md; fi
          exit 1
