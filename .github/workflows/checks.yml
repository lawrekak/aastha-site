name: Site checks

# Cloudflare Pages builds and deploys on every push (build command runs the same checks).
# This workflow repeats the checks on GitHub so problems show up on the commit itself.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and run SEO, structured-data and Rule 36 checks
        run: node build.mjs && node scripts/validate.mjs
