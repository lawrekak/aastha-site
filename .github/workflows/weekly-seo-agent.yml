name: Weekly SEO agent (opens a pull request for review)

# Every Tuesday 10:15 IST, Claude audits the live site with the claude-seo plugin, reads
# Search Console data, makes safe technical fixes and (optionally) drafts one educational
# guide. It never publishes: everything arrives as a pull request that Aastha reviews and
# merges. Merging deploys through Cloudflare.
#
# Needs repository secret ANTHROPIC_API_KEY. Optional: GSC_SERVICE_ACCOUNT_JSON.
# Repository variable DRAFT_ARTICLES = "true" also drafts one long guide; by default (false) the agent makes technical fixes and a report only, since short posts now come from the daily blog agent.

on:
  schedule:
    - cron: "45 4 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: seo-agent
  cancel-in-progress: false

jobs:
  seo-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: GEO audit scripts (geo-seo-claude, vendored in .claude/skills/geo)
        run: python3 -m pip install -q -r .claude/skills/geo/requirements.txt

      - name: Build and check the current site
        run: node build.mjs && node scripts/validate.mjs

      - name: Search Console data (last 28 days)
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/gsc-report.mjs 28

      - name: Live site audit
        continue-on-error: true
        run: node scripts/audit-live.mjs

      - name: Claude SEO agent
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          DRAFT_ARTICLES: ${{ vars.DRAFT_ARTICLES || 'false' }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: |
            https://github.com/AgriciDaniel/claude-seo.git
          plugins: |
            claude-seo@agricidaniel-claude-seo
          claude_args: |
            --model claude-sonnet-5
            --max-turns 100
            --allowedTools "Skill,Task,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Bash(node:*),Bash(npm:*),Bash(python3:*),Bash(pip:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(date:*),Bash(cat:*),Bash(ls:*)"
          prompt: |
            REPO: ${{ github.repository }}
            Follow the instructions in .github/seo-agent.md exactly.
            DRAFT_ARTICLES is "${{ vars.DRAFT_ARTICLES || 'false' }}".
            Today is the run date shown by `date +%F`.

      - name: Open the pull request (or file the report as an issue)
        if: steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          DAY=$(TZ=Asia/Kolkata date +%F)
          if [ ! -f .seo-pr.md ]; then
            node -e "try{const a=[].concat(JSON.parse(require('fs').readFileSync(process.env.EXEC,'utf8')));const r=a.reverse().find(x=>x&&x.type==='result')||{};const tools={};for(const m of a)for(const c of (m.message&&m.message.content)||[])if(c.type==='tool_use')tools[c.name]=(tools[c.name]||0)+1;console.log('The SEO agent finished without writing .seo-pr.md.\\n\\nTurns: '+r.num_turns+'. Tools used: '+JSON.stringify(tools)+'\\n\\nIts final message:\\n\\n'+String(r.result||'').slice(0,6000))}catch(e){console.log('The SEO agent finished without writing a description (no log: '+e.message+').')}" > .seo-pr.md
          fi
          { cat .seo-pr.md; echo; echo "Nothing is published until this pull request is merged."; } > pr-body.md
          if git diff --quiet -- content build.mjs src reports .claude/skills && [ -z "$(git ls-files --others --exclude-standard content reports src)" ]; then
            gh label create seo --color 1E3A8A --force >/dev/null || true
            gh issue create --label seo --title "Weekly SEO report $DAY (no file changes)" --body-file .seo-pr.md
            exit 0
          fi
          node build.mjs && node scripts/validate.mjs
          BRANCH="seo/weekly-$DAY"
          git config user.name "seo-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add content build.mjs src reports .claude/skills
          git commit -m "Weekly SEO update $DAY"
          git push origin "$BRANCH"
          gh label create seo --color 1E3A8A --force >/dev/null || true
          gh pr create --base main --head "$BRANCH" --label seo --title "Weekly SEO update $DAY" --body-file pr-body.md

      - name: Report a failed Claude run
        if: steps.claude.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          MSG=$(node -e "try{const a=JSON.parse(require('fs').readFileSync(process.env.EXEC,'utf8'));const r=[].concat(a).reverse().find(x=>x&&x.type==='result')||{};console.log(String(r.result||r.subtype||'unknown').slice(0,500)+' (turns: '+(r.num_turns??'?')+')')}catch(e){console.log('no execution log: '+e.message)}")
          echo "::error::Claude run failed: $MSG"
          gh label create agent-failure --color B91C1C --force >/dev/null || true
          N=$(gh issue list --label agent-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf '**%s** failed on %s: %s\n\nRun: %s\n\nIf this says *usage limits*, raise the spend limit at console.anthropic.com → Settings → Limits, or wait for the reset date shown.\n' "${{ github.workflow }}" "$(TZ=Asia/Kolkata date '+%F %H:%M IST')" "$MSG" "$RUN_URL" > fail.md
          if [ -z "$N" ]; then gh issue create --label agent-failure --title "Scheduled Claude agents: failed runs" --body-file fail.md; else gh issue comment "$N" --body-file fail.md; fi
          exit 1
